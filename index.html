<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9XL06NFSXP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-9XL06NFSXP');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Quadron Login</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>

/* HIDE UNTIL LOGIN CHECK */
body{display:none;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
height:100dvh;
background:black;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
display:flex;
flex-direction:column;
overflow:hidden;
color:white;
overscroll-behavior:none;
touch-action:manipulation;
}

/* ================= MOBILE-FIRST LAYOUT ================= */

#rightPanel{
flex:0 0 auto;
height:34vh;
min-height:150px;
width:100%;
position:relative;
overflow:hidden;
background:black;
display:flex;
justify-content:center;
align-items:center;
}

#rightPanel::after{
content:"";
position:absolute;
inset:auto -30% -40% auto;
width:120%;
height:120%;
background:radial-gradient(circle at right,
rgba(255,240,0,.55) 0%,
rgba(255,230,0,.4) 22%,
rgba(255,210,0,.22) 42%,
transparent 72%);
pointer-events:none;
}

#quadronText{
font-size:clamp(52px,16vw,92px);
font-weight:800;
letter-spacing:-.05em;
color:white;
text-shadow:0 0 12px #ffffff,0 0 32px rgba(255,255,255,.7),0 0 80px rgba(255,230,0,.35);
}

#leftPanel{
flex:1 1 auto;
width:100%;
min-height:0;
display:flex;
justify-content:center;
align-items:center;
padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));
border-top:2px solid rgba(255,230,0,.25);
background:black;
}

#loginBox{
width:100%;
max-width:360px;
text-align:center;
}

#loginBox h2{
font-weight:600;
margin-bottom:24px;
font-size:20px;
}

.loginBtn{
width:100%;
padding:14px;
margin:10px 0;

background:#050505;
border:2px solid #ffe600;
border-radius:14px;

color:#ffe600;
font-size:15px;
font-weight:600;

cursor:pointer;
transition:.18s;
}

.loginBtn:active{
background:#ffe600;
color:black;
transform:scale(.98);
}

#skip{
margin-top:16px;
font-size:14px;
opacity:.7;
cursor:pointer;
}

#skip:active{
opacity:1;
}

.g_id_signin{
display:flex;
justify-content:center;
}

.cf-turnstile{
margin:16px 0;
display:flex;
justify-content:center;
}

/* ================= DESKTOP ================= */

@media(min-width:820px){

body{
flex-direction:row;
}

#rightPanel{
height:100%;
flex:1;
order:2;
}

#leftPanel{
height:100%;
flex:0 0 42%;
min-width:380px;
border-top:0;
border-right:2px solid rgba(255,230,0,.25);
padding:40px;
}

#quadronText{
font-size:120px;
}

}

@media(prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}

</style>
</head>

<body>

<div id="leftPanel">
<div id="loginBox">

<h2>Log into your account</h2>

<div id="g_id_onload"
data-client_id="1050489714046-adurc65sk6qomb1ufhkmliimka1bddtj.apps.googleusercontent.com"
data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
data-type="standard"
data-theme="filled_black"
data-size="large"
data-shape="pill"
data-text="signin_with">
</div>

<div class="cf-turnstile"
data-sitekey="0x4AAAAAACqOZECQ4_L5eg0G"
style="margin:16px 0;">
</div>

<button class="loginBtn" onclick="guestLogin()">Skip Sign-in</button>

<div id="skip" onclick="guestLogin()">Continue as guest</div>

</div>
</div>

<div id="rightPanel">
<div id="quadronText">Quadron</div>
</div>

<script>

/* ✅ AUTO LOGIN CHECK (MAIN FIX) */
window.onload = () => {
    const userRaw = localStorage.getItem("quadronUser");

    if(userRaw && userRaw !== "null"){
        try{
            const user = JSON.parse(userRaw);

            if(user && (user.email || user === "guest")){
                window.location.href = "home.html";
                return;
            }
        }catch(e){
            // if parsing fails but exists → still redirect
            window.location.href = "home.html";
            return;
        }
    }

    /* show page only if NOT logged in */
    document.body.style.display = "flex";
};

/* GOOGLE LOGIN */

function handleCredentialResponse(response){
const jwt = response.credential
const payload = JSON.parse(atob(jwt.split('.')[1]))

const user = {
name: payload.name,
email: payload.email,
picture: payload.picture
}

localStorage.setItem("quadronUser", JSON.stringify(user))
enterSite()
}

/* GUEST LOGIN */

function guestLogin(){
localStorage.setItem("quadronUser","guest")
enterSite()
}

/* REDIRECT */

function enterSite(){
window.location.href = "home.html"
}

</script>

</body>
</html>
