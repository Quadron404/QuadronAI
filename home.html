<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Quadron AI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{
  --bg:#000;
  --surface:rgba(20,20,20,.85);
  --surface-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.1);
  --line-strong:rgba(255,255,255,.18);
  --text:#f5f3ea;
  --muted:#909090;
  --yellow:#ffda00;
  --yellow-soft:rgba(255,218,0,.16);
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at 52% 28%,rgba(255,218,0,.06),transparent 34%),
    #000;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button,textarea,input{font:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
.app{
  position:relative;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ============ HEADER ============ */
.topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:calc(10px + var(--safe-t)) 14px 10px;
  border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.6);
  z-index:5;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  letter-spacing:-.02em;
  font-size:19px;
  color:#fff;
}
.brand .dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 12px var(--yellow);
  flex:0 0 auto;
}
.brand b{color:var(--yellow)}
.top-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}
.icon-btn{
  width:40px;height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:transparent;
  color:#ddd;
  transition:background .15s var(--ease);
}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.stealth.on{color:var(--yellow)}
.avatar{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;
  border:1px solid var(--line-strong);
  background:var(--surface-2);
}

/* ============ MAIN / STAGE ============ */
.stage{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
}
.center{
  flex:1 1 auto;
  min-height:0;
  width:min(980px,100%);
  margin:0 auto;
  display:flex;
  flex-direction:column;
  position:relative;
}
.thread{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  padding:14px 14px 10px;
  scroll-behavior:auto;
  content-visibility:auto;
  contain-intrinsic-size:auto 400px;
}
.thread::-webkit-scrollbar{width:8px}
.thread::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.thread::-webkit-scrollbar-track{background:transparent}

/* hero / empty state */
.hero{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:20px;
  text-align:center;
  transition:opacity .2s var(--ease),visibility .2s var(--ease);
  pointer-events:auto;
}
.hero.hide{opacity:0;visibility:hidden;pointer-events:none}
.quadron-logo{
  margin:0;
  font-size:clamp(52px,14vw,84px);
  line-height:.9;
  letter-spacing:-.06em;
  font-weight:800;
  color:var(--yellow);
  text-shadow:0 0 18px rgba(255,218,0,.35),0 0 70px rgba(255,218,0,.14);
}
.tagline{
  margin:-4px 0 0;
  color:var(--muted);
  font-size:14px;
  max-width:420px;
  line-height:1.5;
}

/* ============ MESSAGES ============ */
.msg{
  display:flex;
  flex-direction:column;
  margin-bottom:16px;
  animation:messageIn .18s var(--ease) both;
}
@keyframes messageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-items:flex-end}
.msg.ai{align-items:flex-start}
.bubble{
  max-width:88%;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.6;
  font-size:15.5px;
  white-space:pre-wrap;
  word-break:break-word;
}
.user .bubble{
  background:var(--yellow);
  color:#000;
  font-weight:520;
  border-bottom-right-radius:6px;
}
.ai .bubble{
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom-left-radius:6px;
  color:#f2f2f2;
}
.msg.ai .bubble a{color:var(--yellow)}
.who{
  font-size:11px;
  color:var(--muted);
  margin:0 0 4px 6px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.user .who{margin-right:6px}
.typing{
  display:inline-flex;
  gap:5px;
  padding:16px 18px;
  align-items:center;
}
.typing i{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted);
  animation:blink 1.2s infinite both;
}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.sources{display:grid;gap:7px;margin-top:10px}
.source{
  display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);border-radius:12px;
  color:#eaeaea;text-decoration:none;padding:9px 10px;
  background:var(--surface-2);
}
.source img{width:20px;height:20px;border-radius:4px}
.source b{display:block;font-size:13px}
.source span{display:block;color:#999;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.codebox{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:#080808;
  margin-top:4px;
}
.codebar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 10px;border-bottom:1px solid var(--line);color:#ddd;
}
.codebar b{font-size:12.5px}
.codebar span{display:flex;gap:5px}
.codebar button{
  background:var(--surface-2);color:#eee;
  border-radius:8px;padding:5px 9px;font-size:12px;
}
.codebox pre{
  margin:0;padding:12px;overflow:auto;max-height:380px;font-size:13px;
}

.media-stage{
  width:100%;aspect-ratio:16/10;
  border-radius:16px;border:1px solid var(--line);
  background:radial-gradient(circle,rgba(255,218,0,.12),transparent 42%),#050505;
  display:grid;place-items:center;overflow:hidden;
}
.media-stage img{width:100%;height:100%;object-fit:contain;display:block}
.media-stage span{color:var(--yellow);font-weight:700;font-size:14px}

/* ============ COMPOSER ============ */
.composer-wrap{
  flex:0 0 auto;
  width:min(980px,100%);
  margin:0 auto;
  padding:8px 12px calc(10px + var(--safe-b));
  background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,0));
}
.composer{
  display:flex;
  align-items:flex-end;
  gap:6px;
  border:1px solid var(--line-strong);
  border-radius:22px;
  background:var(--surface);
  padding:7px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  transition:border-color .15s var(--ease);
}
.composer:focus-within{border-color:rgba(255,218,0,.4)}
.composer textarea{
  flex:1;
  min-width:0;
  height:24px;
  max-height:110px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#f3f3f3;
  padding:8px 6px;
  font-size:16px;
  line-height:1.45;
  overflow:hidden;
}
.composer textarea::placeholder{color:#7c7c7c}
.composer .btn{
  flex:0 0 auto;
  width:42px;height:42px;
  border-radius:15px;
  display:grid;place-items:center;
  background:var(--surface-2);
  color:#e8e8e8;
  transition:transform .12s var(--ease),background .15s var(--ease);
}
.composer .btn:active{transform:scale(.92)}
.composer .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer .send{
  background:var(--yellow);
  color:#000;
}
.composer .send:active{background:#fff}
.upload-preview{
  display:none;
  flex-wrap:wrap;gap:6px;
  padding:0 6px 6px;
}
.upload-preview.show{display:flex}
.chip{
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface-2);
  color:#e7e7e7;
  padding:6px 10px;
  font-size:12.5px;
  display:inline-flex;align-items:center;gap:7px;
}
.chip button{color:#fff;background:transparent;font-size:14px;line-height:1}

.mode-row{
  display:none;
  gap:8px;
  padding:0 12px 8px;
  width:min(980px,100%);
  margin:0 auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.mode-row::-webkit-scrollbar{display:none}
.mode-row.show{display:flex}
.mode-pill{
  flex:0 0 auto;
  padding:7px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:#cfcfcf;
  font-size:13px;
  font-weight:650;
  transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);
}
.mode-pill.active{
  background:var(--yellow);
  color:#000;
  border-color:var(--yellow);
}

/* ============ GALLERY ============ */
.gallery-view{
  display:none;
  flex:1 1 auto;
  min-height:0;
  flex-direction:column;
  width:min(980px,100%);
  margin:0 auto;
}
.gallery-view.show{display:flex}
.gallery-head{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
}
.gallery-title{margin:0;font-size:20px;letter-spacing:-.03em;color:#fff}
.gallery-status{color:var(--muted);font-size:12.5px}
.gallery-grid{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
  padding:0 3px 10px;
  align-content:start;
}
.gallery-card{
  position:relative;
  aspect-ratio:1/1;
  padding:0;border:0;border-radius:0;
  background:#070707;
  overflow:hidden;
  display:grid;place-items:center;
}
.gallery-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s var(--ease)}
.gallery-card:active img{transform:scale(1.06)}
.gallery-empty,.gallery-sentinel{
  grid-column:1/-1;
  min-height:120px;
  display:grid;place-items:center;
  color:var(--muted);font-size:13.5px;
  text-align:center;padding:16px;
}

/* toast */
.toast{
  position:fixed;
  left:50%;bottom:calc(90px + var(--safe-b));
  transform:translate(-50%,8px);
  z-index:30;
  max-width:min(92vw,420px);
  background:#111;
  border:1px solid var(--line);
  color:#eee;
  padding:11px 15px;
  border-radius:14px;
  font-size:13.5px;
  box-shadow:0 16px 50px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;
  transition:opacity .18s var(--ease),transform .18s var(--ease);
  text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){
  .gallery-grid{grid-template-columns:repeat(3,1fr)}
  .bubble{max-width:78%}
  .thread{padding:22px 24px 12px}
  .composer-wrap{padding:10px 24px calc(14px + var(--safe-b))}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="dot"></span>Quadron <b>AI</b></div>
    <div class="top-actions">
      <button class="icon-btn stealth" id="stealthBtn" title="Stealth mode"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="icon-btn" id="galleryBtn" title="Gallery"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
      <button class="icon-btn" id="voiceBtn" title="Voice mode"><svg viewBox="0 0 24 24"><path d="M5 10v4"/><path d="M9 6v12"/><path d="M13 3v18"/><path d="M17 7v10"/><path d="M21 10v4"/></svg></button>
      <button class="icon-btn" id="profileBtn" title="Profile"><img class="avatar" id="avatar" alt="Profile"></button>
    </div>
  </header>

  <main class="stage">
    <div class="center">
      <section class="thread" id="thread" aria-live="polite"></section>

      <section class="hero" id="hero">
        <h1 class="quadron-logo">Quadron</h1>
        <p class="tagline">Sarcastic by default. Truthful by design. Powered by AI7.</p>
      </section>

      <section class="gallery-view" id="galleryView" aria-label="Quadron image gallery">
        <div class="gallery-head">
          <h2 class="gallery-title">Gallery</h2>
          <div class="gallery-status" id="galleryStatus">Preparing image collection</div>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="gallery-empty" id="galleryEmpty">Images will appear here as they are collected</div>
        <div class="gallery-sentinel" id="gallerySentinel">Scroll to reveal saved images</div>
      </section>
    </div>

    <div class="mode-row" id="modeRow">
      <button class="mode-pill active" data-mode="normal">Chat</button>
      <button class="mode-pill" data-mode="explore">Explore</button>
      <button class="mode-pill" data-mode="code">Code</button>
    </div>

    <div class="composer-wrap">
      <div class="upload-preview" id="uploadPreview"></div>
      <form class="composer" id="composer">
        <button type="button" class="btn" id="attachBtn" title="Attach file"><svg viewBox="0 0 24 24"><path d="M21.4 11.05 12.25 20.2a5 5 0 0 1-7.07-7.07l9.2-9.2a3.5 3.5 0 0 1 4.95 4.95l-9.19 9.2a2 2 0 0 1-2.83-2.83l8.5-8.5"/></svg></button>
        <textarea id="msg" rows="1" placeholder="Ask me anything, but brace yourself..."></textarea>
        <button type="button" class="btn" id="voiceQuickBtn" title="Voice mode"><svg viewBox="0 0 24 24"><path d="M5 10v4"/><path d="M9 6v12"/><path d="M13 3v18"/><path d="M17 7v10"/><path d="M21 10v4"/></svg></button>
        <button type="submit" class="btn send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </form>
    </div>
  </main>
</div>

<input type="file" id="fileInput" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.doc,.docx,.ppt,.pptx" hidden>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const LIMITS={messages:100,images:5};
const GROQ_ATTACHMENT_KEY="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";
const GROQ_ATTACHMENT_MODELS=["llama-3.2-90b-vision-preview","llama-3.2-11b-vision-preview","meta-llama/llama-4-scout-17b-16e-instruct"];
const GALLERY_WORDS=[
  "water","fire","earth","air","sky","cloud","rain","snow","ice","fog","storm","wind","sun","moon","star","light","darkness","shadow","tree","forest",
  "leaf","flower","grass","plant","seed","root","mountain","hill","valley","river","lake","ocean","sea","beach","sand","stone","rock","cliff","cave","island",
  "desert","field","road","path","bridge","city","town","village","house","building","tower","castle","temple","church","school","hospital","shop","market","car","bus",
  "train","bike","street","lamp","door","window","wall","roof","floor","table","chair","bed","room","kitchen","bathroom","computer","phone","screen","keyboard",
  "mouse","robot","machine","engine","gear","clock","watch","circle","square","triangle","line","point","shape","color","red","blue","green","yellow","black","white",
  "orange","purple","pink","gold","silver","metal","wood","glass","plastic","fabric","cloth","paper","book","page","pen","pencil","ink","paint","brush","canvas",
  "art","music","sound","voice","song","noise","silence","emotion","smile","face","eye","hand","foot","body","head","hair","skin","animal","dog","cat",
  "bird","fish","horse","cow","sheep","lion","tiger","bear","wolf","fox","rabbit","insect","ant","bee","spider","dragon","ghost","spirit","energy","power",
  "electricity","magnet","gravity","atom","molecule","space","planet","galaxy","universe","nebula","comet","asteroid","rocket","satellite","alien","technology","future","past","present","memory",
  "dream","reality","life","death","birth","growth","time","speed","motion","stillness","pattern","code","data","signal","network","system","logic","order","chaos","balance",
  "harmony","peace","war","battle","weapon","shield","armor","king","queen","prince","princess","soldier","crowd","isolation","freedom","prison","key","lock","doorway",
  "portal","dimension","horizon","distance","infinity"
];
const SARCASM="Every response must include a light, useful sarcastic remark while staying professional. Tell the truth, never fabricate facts or sources, and if asked who developed you, say: developed by AI7.";
let db,currentChatId=null,currentMessages=[],mode="normal",attachedFiles=[],stealthMode=false;
let galleryDB=null,galleryItems=[],galleryShown=0,galleryCollecting=false,galleryObserver=null,galleryOpened=false;
const user=getUser();
avatar.src=user.picture;

/* =========================
   CLIENT-SIDE HARMFUL-WORD FILTER
   (mirror of the server filter; blocks before sending)
========================= */
const HARMFUL_PATTERNS=[
  /\b(kill|murder|slaughter|assassinate)\s+(yourself|me|him|her|them|everyone|the\s+.*)\b/i,
  /\b(commit|attempt)(\w+)?\s+suicide|suicidal|end\s+(my|your)\s+life|take\s+(my|your)\s+own\s+life|(kill|cut|hurt|harm)\s+(myself|yourself)|self[\s-]?harm|want(s|ed)?\s+to\s+die/i,
  /\b(bomb|bombs?|explosive|detonat(e|ion))\s+(the\s+|a\s+|an\s+)?(school|people|crowd|building|airport|station|mall)\b/i,
  /\b(shoot(ing|er)?|gun\s+down|massacre)\s+(the\s+)?(school|people|crowd|kids?|students?)\b/i,
  /\b(sell|buy|traffic[kf]?)\s+(children|babies?|kidneys?|drugs?|cocaine|heroin|meth)\b/i,
  /\b(make|build|how\s+to\s+make)\s+(a|an)?\s*(bomb|pipe\s+bomb|napalm|ricin|sar(?:in|an)|explosive\s+devices?)\b/i,
  /\b(rape|sexual\s+assault|groom(e|ing)?\s+a\s+minor)\b/i
];
function isHarmful(text){return HARMFUL_PATTERNS.some(re=>re.test(text))}

function getUser(){
  const raw=localStorage.getItem("quadronUser");
  if(raw==="guest"||!raw)return{name:"Guest",email:"guest@quadron.local",picture:"https://cdn-icons-png.flaticon.com/512/149/149071.png"};
  try{const u=JSON.parse(raw);return{name:u.name||"Guest",email:u.email||"",picture:u.picture||"https://cdn-icons-png.flaticon.com/512/149/149071.png"}}catch{return{name:"Guest",email:"guest@quadron.local",picture:"https://cdn-icons-png.flaticon.com/512/149/149071.png"}}
}
function usage(){
  const k="quadronUsage_"+(user.email||"guest");
  let v=JSON.parse(localStorage.getItem(k)||"null");
  const d=new Date().toISOString().slice(0,10);
  if(!v||v.date!==d)v={date:d,messages:0,images:0};
  if(typeof v.images!=="number")v.images=0;
  if(typeof v.messages!=="number")v.messages=0;
  return v;
}
function saveUsage(v){localStorage.setItem("quadronUsage_"+(user.email||"guest"),JSON.stringify(v))}
function canUse(t){
  const u=usage();
  if(u[t]>=LIMITS[t]){toast(`Daily ${t} limit reached. Even ambition needs a quota.`);return false}
  u[t]++;saveUsage(u);return true;
}
let toastTimer;
function toast(t){
  const el=$("#toast");
  el.textContent=t;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}
function openDB(){
  return new Promise(res=>{
    const r=indexedDB.open("quadronDB_v4",1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore("chats",{keyPath:"id"});
    r.onsuccess=e=>{db=e.target.result;res()};
  });
}
function saveChat(){
  if(stealthMode||!db||!currentChatId)return;
  const title=(currentMessages.find(m=>m.role==="user")?.content||"New chat").slice(0,52);
  db.transaction("chats","readwrite").objectStore("chats").put({id:currentChatId,title,messages:currentMessages,updated:Date.now()});
}
function newChat(){
  currentChatId=null;
  currentMessages=[];
  thread.innerHTML="";
  hero.classList.remove("hide");
  setMode("normal");
  msg.value="";
  attachedFiles=[];
  renderFiles();
  msg.focus();
}
function renderMessage(m){
  hero.classList.add("hide");
  const row=document.createElement("div");
  row.className="msg "+m.role;
  const who=document.createElement("div");
  who.className="who";
  who.textContent=m.role==="user"?(user.name||"You"):"Quadron";
  const bubble=document.createElement("div");
  bubble.className="bubble";
  row.append(who,bubble);
  if(m.kind==="code"&&m.role==="ai")createCodeBox(bubble,m.content);
  else if(m.kind==="image"&&m.role==="ai")bubble.appendChild(mediaNode(m));
  else bubble.textContent=m.content||"";
  if(m.files?.length)bubble.appendChild(fileChips(m.files));
  if(m.sources?.length)bubble.appendChild(sourceCards(m.sources));
  thread.appendChild(row);
  scrollThread();
  return bubble;
}
function scrollThread(){requestAnimationFrame(()=>{thread.scrollTop=thread.scrollHeight})}
function fileChips(files){
  const w=document.createElement("div");
  w.style.marginTop="8px";
  files.forEach(f=>{const c=document.createElement("span");c.className="chip";c.textContent=f.name;w.appendChild(c)});
  return w;
}
function sourceCards(srcs){
  const w=document.createElement("div");
  w.className="sources";
  srcs.forEach(s=>{
    try{
      const u=new URL(s.url);
      const a=document.createElement("a");
      a.className="source";
      a.href=s.url;
      a.target="_blank";
      a.rel="noopener";
      a.innerHTML=`<img src="https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64" alt="" loading="lazy"><div><b>${s.title||u.hostname}</b><span>${s.url}</span></div>`;
      w.appendChild(a);
    }catch{}
  });
  return w;
}
function mediaNode(m){
  const d=document.createElement("div");
  d.className="media-stage";
  if(m.url){
    const i=document.createElement("img");
    i.src=m.url;
    i.alt=m.prompt||"Generated image";
    i.loading="lazy";
    d.appendChild(i);
  }else d.innerHTML="<span>Generating. The pixels are finding themselves...</span>";
  return d;
}
function createCodeBox(parent,code){
  const box=document.createElement("div");
  box.className="codebox";
  box.innerHTML=`<div class="codebar"><b>${detect(code)}</b><span><button>Copy</button><button>Run</button><button>Debug</button></span></div><pre><code></code></pre>`;
  const c=box.querySelector("code");
  c.textContent=code;
  parent.appendChild(box);
  hljs.highlightElement(c);
  const [copy,run,debug]=box.querySelectorAll("button");
  copy.onclick=()=>navigator.clipboard.writeText(code).then(()=>toast("Copied. A historic clipboard moment."));
  run.onclick=()=>{
    if(!/<!doctype|<html/i.test(code))return toast("Run preview supports HTML only. Devastating, I know.");
    const f=document.createElement("iframe");
    f.sandbox="allow-scripts";
    f.style.cssText="width:100%;height:320px;border:0;background:white";
    f.srcdoc=code;
    box.appendChild(f);
  };
  debug.onclick=async()=>{
    const fixed=await askAI(`Fix this code. Return only complete fixed code:\n${code}`);
    c.textContent=fixed.replace(/```[\w-]*/g,"").replace(/```/g,"").trim();
    hljs.highlightElement(c);
  };
}
function detect(c){
  if(/<!doctype|<html/i.test(c))return"HTML";
  if(/\bfunction\b|=>|const |let /.test(c))return"JavaScript";
  if(/\bdef |print\(/.test(c))return"Python";
  return"Code";
}
async function readFiles(list){
  const out=[];
  for(const file of list){
    const item={name:file.name,type:file.type,size:file.size};
    if(file.type.startsWith("image/")){
      item.dataUrl=await fileToDataUrl(file);
      item.text="Image attached for Groq vision recognition.";
    }else if(file.type.startsWith("text/")||/\.(txt|md|csv|json)$/i.test(file.name)){
      item.text=(await file.text()).slice(0,12000);
    }else{
      try{
        item.text=(await file.text()).replace(/[^\x09\x0A\x0D\x20-\x7E]+/g," ").replace(/\s{3,}/g," ").slice(0,12000);
      }catch{
        item.text="";
      }
    }
    out.push(item);
  }
  return out;
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function renderFiles(){
  uploadPreview.innerHTML="";
  uploadPreview.classList.toggle("show",attachedFiles.length>0);
  attachedFiles.forEach((f,i)=>{
    const c=document.createElement("span");
    c.className="chip";
    c.innerHTML=`${f.name}<button type="button" aria-label="Remove">x</button>`;
    c.querySelector("button").onclick=()=>{attachedFiles.splice(i,1);renderFiles()};
    uploadPreview.appendChild(c);
  });
}
function autoresize(){msg.style.height="0px";msg.style.height=Math.min(msg.scrollHeight,110)+"px"}
async function send(e){
  e&&e.preventDefault();
  const text=msg.value.trim();
  if(!text&&!attachedFiles.length)return;

  if(isHarmful(text)){
    toast("Filtered. We're sarcastic, not a supervillain lab.");
    return;
  }

  if(lowerStartsWithImage(text))return generateMedia("image",text.replace(/^create image:|^\/image/i,"").trim());
  if(!canUse("messages"))return;
  if(!currentChatId)currentChatId="chat_"+Date.now();
  const files=attachedFiles.map(({name,type,size,text,dataUrl})=>({name,type,size,text,dataUrl}));
  const um={role:"user",content:text,files,kind:mode};
  currentMessages.push(um);
  renderMessage(um);
  msg.value="";
  autoresize();
  attachedFiles=[];
  renderFiles();
  const ai={role:"ai",content:"",kind:mode};
  currentMessages.push(ai);
  const bubble=renderMessage(ai);
  const think=document.createElement("div");
  think.className="typing";
  think.innerHTML="<i></i><i></i><i></i>";
  bubble.appendChild(think);
  try{
    let reply=clean(await (files.length ? askVision(text,files) : askAI(buildPrompt(text,files))));
    if(mode==="code")reply=reply.replace(/```[\w-]*/g,"").replace(/```/g,"").trim();
    ai.content=reply;
    bubble.innerHTML="";
    if(mode==="code")createCodeBox(bubble,reply);
    else{
      await streamText(bubble,reply);
      if(mode==="explore"){ai.sources=extractSources(reply,text);bubble.appendChild(sourceCards(ai.sources))}
    }
    saveChat();
  }catch{
    ai.content="Connection failed. Even the server needed a dramatic exit.";
    bubble.innerHTML="";
    bubble.textContent=ai.content;
    saveChat();
  }
}
function lowerStartsWithImage(text){
  const lower=text.toLowerCase();
  return lower.startsWith("create image:")||lower.startsWith("/image");
}
function buildPrompt(text,files){
  const f=files.map(x=>x.text?`\nFile ${x.name}:\n${x.text}`:`\nAttached file: ${x.name}`).join("");
  if(mode==="explore")return`${SARCASM}\nAnswer with careful facts and include source URLs at the end when possible.${f}\nUser: ${text}`;
  if(mode==="code")return`${SARCASM}\nReturn complete working code when code is requested. Avoid clutter.${f}\nUser: ${text}`;
  return`${SARCASM}\n${f}\nUser: ${text}`;
}
async function askAI(message){
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
  if(!r.ok)throw new Error("chat");
  const d=await r.json();
  return d.reply||d.text||"";
}
async function askVision(message,files){
  const content=[
    {
      type:"text",
      text:`Analyze the attached files/images directly. Extract visible text from screenshots, summarize document text, and answer the user. User request: ${message||"Analyze the attachments."}`
    }
  ];
  files.slice(0,4).forEach(f=>{
    if(f.dataUrl)content.push({type:"image_url",image_url:{url:f.dataUrl}});
    else if(f.text)content.push({type:"text",text:`File ${f.name}:\n${f.text}`});
    else content.push({type:"text",text:`Attached file ${f.name} (${f.type||"unknown type"}) could not be read in the browser.`});
  });
  let lastError="";
  for(const model of GROQ_ATTACHMENT_MODELS){
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${GROQ_ATTACHMENT_KEY}`
      },
      body:JSON.stringify({
        model,
        temperature:.2,
        max_completion_tokens:1200,
        messages:[
          {role:"system",content:"You are Quadron attachment analysis. Use only the attached image/document content and the user's request. Be accurate, concise, and mention if a file cannot be read. If asked who developed you, say developed by AI7."},
          {role:"user",content}
        ]
      })
    });
    if(r.ok){
      const d=await r.json();
      return d.choices?.[0]?.message?.content||"No attachment details found.";
    }
    lastError=await r.text().catch(()=>"");
  }
  throw new Error(lastError||"vision");
}
function clean(t){return(t||"").trim()||"No response. Truly avant-garde."}
/* rAF-batched typewriter — smooth and cheap on low-end devices */
async function streamText(el,text){
  el.textContent="";
  let i=0;
  const N=text.length;
  return new Promise(res=>{
    const BATCH=24;
    function step(){
      const end=Math.min(i+BATCH,N);
      el.textContent+=text.slice(i,end);
      i=end;
      if(i>=N){res();return}
      scrollThread();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function extractSources(reply,q){
  const urls=[...reply.matchAll(/https?:\/\/[^\s)]+/g)].map(m=>m[0].replace(/[.,;]+$/,""));
  return urls.length?[...new Set(urls)].slice(0,5).map(url=>({url})):[{title:"Search the web",url:"https://www.google.com/search?q="+encodeURIComponent(q)}];
}
function setMode(m){
  mode=m;
  $$(".mode-pill").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  if(m==="explore")msg.placeholder="Ask what you want Quadron to explore with sources";
  else if(m==="code")msg.placeholder="Describe what you want to code";
  else msg.placeholder="Ask me anything, but brace yourself...";
  msg.focus();
}
/* ============ GALLERY ============ */
function setView(gallery){
  galleryView.classList.toggle("show",gallery);
  thread.style.display=gallery?"none":"block";
  hero.classList.toggle("hide",gallery);
  modeRow.classList.toggle("show",!gallery);
  galleryBtn.classList.toggle("stealth",gallery);
  galleryBtn.classList.toggle("on",gallery);
  if(gallery){
    if(!galleryOpened){galleryOpened=true;openGalleryDB().then(loadGalleryItems).then(()=>collectGalleryImages())}
    else renderMoreGallery(24);
  }
}
function openGalleryDB(){
  return new Promise(resolve=>{
    const req=indexedDB.open("quadronGalleryStore_v1",1);
    req.onupgradeneeded=e=>{
      const database=e.target.result;
      if(!database.objectStoreNames.contains("images"))database.createObjectStore("images",{keyPath:"word"});
    };
    req.onsuccess=e=>{galleryDB=e.target.result;resolve()};
    req.onerror=()=>resolve();
  });
}
function galleryStore(){
  if(!galleryDB)return null;
  return galleryDB.transaction("images","readwrite").objectStore("images");
}
function loadGalleryItems(){
  if(!galleryDB)return Promise.resolve([]);
  return new Promise(resolve=>{
    const req=galleryDB.transaction("images","readonly").objectStore("images").getAll();
    req.onsuccess=()=>{
      galleryItems=req.result.sort((a,b)=>a.index-b.index);
      galleryShown=0;
      galleryGrid.innerHTML="";
      galleryEmpty.style.display=galleryItems.length?"none":"grid";
      renderMoreGallery();
      resolve(galleryItems);
    };
    req.onerror=()=>resolve([]);
  });
}
function imageSrcFromItem(item){
  if(item.blob)return URL.createObjectURL(item.blob);
  return item.url;
}
function renderMoreGallery(count=24){
  if(!galleryItems.length){
    galleryEmpty.style.display="grid";
    return;
  }
  galleryEmpty.style.display="none";
  const end=Math.min(galleryItems.length,galleryShown+count);
  for(let i=galleryShown;i<end;i++){
    const item=galleryItems[i];
    if(document.querySelector(`[data-gallery-word="${item.word}"]`))continue;
    const card=document.createElement("button");
    card.className="gallery-card";
    card.type="button";
    card.dataset.galleryWord=item.word;
    const img=document.createElement("img");
    img.alt=item.word;
    img.loading="lazy";
    img.src=imageSrcFromItem(item);
    card.appendChild(img);
    card.onclick=()=>window.open(item.url,"_blank","noopener");
    galleryGrid.appendChild(card);
  }
  galleryShown=end;
}
function saveGalleryImage(item){
  const store=galleryStore();
  if(!store)return;
  store.put(item);
}
async function collectGalleryImages(){
  if(galleryCollecting)return;
  galleryCollecting=true;
  const existing=new Set(galleryItems.map(item=>item.word));
  for(let i=0;i<GALLERY_WORDS.length;i++){
    const word=GALLERY_WORDS[i];
    if(existing.has(word))continue;
    galleryStatus.textContent=`Collecting ${i+1}/${GALLERY_WORDS.length}: ${word}`;
    const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(word)}`;
    try{
      const response=await fetch(url,{cache:"no-store"});
      if(!response.ok)throw new Error("image");
      const blob=await response.blob();
      if(!blob.type.startsWith("image/"))throw new Error("not image");
      const item={word,index:i,url,blob,createdAt:Date.now()};
      saveGalleryImage(item);
      galleryItems.push(item);
      galleryItems.sort((a,b)=>a.index-b.index);
      if(galleryView.classList.contains("show"))renderMoreGallery(1);
      existing.add(word);
    }catch{
      galleryStatus.textContent=`Skipped ${word}, retrying later`;
    }
    await new Promise(resolve=>setTimeout(resolve,650));
  }
  galleryStatus.textContent=`Saved ${galleryItems.length} images`;
  galleryCollecting=false;
}
async function generateMedia(kind,prompt){
  if(kind!=="image")return toast("Video generation has been removed.");
  if(!prompt)return toast("Describe the image first. I left telepathy in the other build.");
  if(!canUse("images"))return;
  if(!currentChatId)currentChatId="chat_"+Date.now();
  const um={role:"user",content:`Create image: ${prompt}`,kind};
  currentMessages.push(um);
  renderMessage(um);
  msg.value="";
  const ai={role:"ai",kind,prompt,url:""};
  currentMessages.push(ai);
  const b=renderMessage(ai);
  try{
    ai.url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
    ai.content=ai.url;
    b.innerHTML="";
    b.appendChild(mediaNode(ai));
    saveChat();
  }catch{
    b.textContent="Generation failed. The pixels staged a tiny rebellion.";
    saveChat();
  }
  msg.placeholder=mode==="explore"?"Ask what you want Quadron to explore with sources":(mode==="code"?"Describe what you want to code":"Ask me anything, but brace yourself...");
}

/* ============ WIRE UP ============ */
composer.onsubmit=send;
sendBtn.onclick=send;
msg.oninput=autoresize;
msg.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e)}};
attachBtn.onclick=()=>fileInput.click();
fileInput.onchange=async e=>{attachedFiles=attachedFiles.concat(await readFiles(e.target.files));fileInput.value="";renderFiles()};
galleryBtn.onclick=()=>setView(!galleryView.classList.contains("show"));
voiceBtn.onclick=voiceQuickBtn.onclick=()=>location.href="voice.html";
profileBtn.onclick=()=>location.href="profile.html";
avatar.onclick=()=>location.href="profile.html";
stealthBtn.onclick=()=>{
  stealthMode=!stealthMode;
  stealthBtn.classList.toggle("on",stealthMode);
  toast(stealthMode?"Stealth on. New chats will not be saved.":"Stealth off. History saving is back.");
};
$$(".mode-pill").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

openDB().then(()=>{
  if(db){
    const req=db.transaction("chats","readonly").objectStore("chats").getAll();
    req.onsuccess=()=>{
      const list=req.result.sort((a,b)=>(b.updated||0)-(a.updated||0));
      if(list.length)renderMessage({role:"ai",content:`Welcome back. You have ${list.length} saved chat${list.length===1?"":"s"} — I'll try not to forget them, unlike you.`});
    };
  }
});
