<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a10"><title>Quadron — Intelligence, in focus</title>
  <style>
    :root{--bg:#080a10;--panel:rgba(23,27,40,.58);--panel-2:rgba(255,255,255,.065);--line:rgba(255,255,255,.12);--text:#f5f7ff;--muted:#9aa2b7;--blue:#76a9ff;--violet:#b491ff;--glow:rgba(105,154,255,.24)}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 11% 2%,#25366a 0,transparent 30rem),radial-gradient(circle at 95% 70%,#392257 0,transparent 31rem),var(--bg);color:var(--text);overflow:hidden}button,input{font:inherit}.app{height:100dvh;display:grid;grid-template-columns:274px minmax(0,1fr)}.sidebar{padding:18px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(6,8,14,.53);backdrop-filter:blur(26px);z-index:2}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.03em;font-size:19px;padding:7px 9px 21px}.mark{width:29px;height:29px;border-radius:10px;background:conic-gradient(from 210deg,#658fff,#d1bcff,#7ee2ff,#658fff);box-shadow:0 0 26px var(--glow)}.new-chat,.send{border:0;color:#07101d;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#d5e4ff,#83abff 45%,#b68cff);box-shadow:0 10px 26px rgba(70,112,212,.22);transition:.2s}.new-chat{padding:12px 14px;border-radius:14px;text-align:left}.new-chat:hover,.send:hover{transform:translateY(-1px);filter:brightness(1.06)}.nav-label{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin:25px 8px 9px}.history{overflow:auto;min-height:0}.history button{width:100%;border:0;background:transparent;border-radius:10px;padding:10px 9px;color:#b9c1d4;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.history button:hover,.history button.active{background:var(--panel-2);color:#fff}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 0;color:var(--muted);font-size:12px}.main{position:relative;display:flex;flex-direction:column;min-width:0}.topbar{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,34px);border-bottom:1px solid var(--line);background:rgba(8,10,16,.27);backdrop-filter:blur(20px)}.mobile-brand{display:none}.model{display:flex;align-items:center;gap:8px;color:#c9d5f0;font-size:13px}.status{width:7px;height:7px;background:#78e9af;border-radius:50%;box-shadow:0 0 12px #78e9af}.actions{display:flex;gap:8px}.icon-button{height:35px;min-width:35px;padding:0 10px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:11px;color:#dce4f5;cursor:pointer}.icon-button:hover{background:rgba(255,255,255,.11)}.conversation{width:min(860px,100%);height:calc(100dvh - 65px);margin:auto;display:flex;flex-direction:column;padding:clamp(16px,4vw,42px) clamp(14px,4vw,28px) 15px}.messages{flex:1;overflow:auto;scroll-behavior:smooth;padding-right:3px}.welcome{min-height:100%;display:grid;place-content:center;text-align:center;padding-bottom:14vh}.welcome h1{font-size:clamp(34px,6vw,58px);letter-spacing:-.06em;margin:0;background:linear-gradient(130deg,#fff 25%,#aac8ff 62%,#caadff);background-clip:text;color:transparent}.welcome p{color:var(--muted);margin:13px auto 27px;max-width:480px;line-height:1.55}.suggestions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.suggestions button{border:1px solid var(--line);background:rgba(255,255,255,.045);color:#d7deee;padding:10px 13px;border-radius:13px;cursor:pointer}.suggestions button:hover{background:rgba(255,255,255,.11)}.message{display:flex;gap:12px;max-width:780px;margin:0 0 24px;line-height:1.65;animation:enter .28s ease-out}.message.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:29px;height:29px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-size:12px;background:linear-gradient(145deg,#7da8ff,#9d79ed)}.user .avatar{background:#263144}.bubble{padding:1px 2px;white-space:pre-wrap}.user .bubble{background:rgba(124,166,255,.14);border:1px solid rgba(139,178,255,.16);padding:10px 13px;border-radius:16px 4px 16px 16px}.assistant .bubble{padding-top:2px}.meta{font-size:11px;color:var(--muted);margin-bottom:3px}.activity{display:none;align-items:center;gap:10px;margin:0 0 20px;color:#b9c5df;font-size:13px}.activity.show{display:flex}.orb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#dbe9ff,#88adff 34%,#5b3aaa);animation:breathe 1.2s ease-in-out infinite;box-shadow:0 0 24px #729aff}.activity.searching .orb{background:conic-gradient(#92b9ff,#b791ff,#92b9ff);animation:spin 1s linear infinite}.composer-wrap{position:relative;margin-top:8px}.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 13px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(18,22,33,.68);backdrop-filter:blur(28px);box-shadow:0 14px 55px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.08)}.composer:focus-within{border-color:rgba(136,175,255,.52);box-shadow:0 0 0 3px rgba(113,153,255,.1),0 18px 55px rgba(0,0,0,.26)}textarea{resize:none;max-height:150px;min-height:26px;line-height:1.45;flex:1;border:0;outline:0;color:#f5f7ff;background:transparent;padding:6px 0;font-size:15px}.utility{width:34px;height:34px;border:0;border-radius:11px;color:#bdc9df;background:transparent;cursor:pointer}.utility:hover,.utility.active{background:rgba(255,255,255,.1);color:#fff}.send{height:35px;padding:0 14px;border-radius:12px}.composer-note{text-align:center;font-size:11px;color:#7f899d;margin:9px 0 0}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#232b3d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;color:#e9efff;font-size:13px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes breathe{50%{transform:scale(1.14);box-shadow:0 0 37px #729aff}}@keyframes spin{to{transform:rotate(1turn)}}
    @media(max-width:720px){body{overflow:hidden}.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:min(83vw,300px);transform:translateX(-105%);transition:.25s;box-shadow:20px 0 50px #000;z-index:10}.sidebar.open{transform:translateX(0)}.mobile-brand{display:flex;align-items:center;gap:9px;font-weight:700}.topbar{padding:0 14px}.model{font-size:11px}.desktop-only{display:none}.conversation{height:calc(100dvh - 65px);padding:21px 14px 10px}.welcome{padding-bottom:11vh}.welcome h1{font-size:39px}.suggestions{max-width:330px}.message{margin-bottom:18px}.messages{padding-bottom:4px}.actions .icon-button:last-child{display:none}.composer{border-radius:18px}.composer-note{font-size:10px}}
  </style>
</head>
<body><div class="app">
  <aside class="sidebar" id="sidebar"><div class="brand"><span class="mark"></span>Quadron</div><button class="new-chat" id="newChat">＋ New conversation</button><div class="nav-label">Recent</div><div class="history" id="history"></div><div class="side-bottom">GPT‑OSS 20B <span style="float:right;color:#78e9af">● online</span></div></aside>
  <main class="main"><header class="topbar"><div class="mobile-brand"><button class="icon-button" id="menu" aria-label="Open menu">☰</button><span class="mark"></span> Quadron</div><div class="model desktop-only"><span class="status"></span> GPT‑OSS 20B <span style="color:#778199">· Groq</span></div><div class="actions"><button class="icon-button" id="clear" title="New conversation">＋</button><button class="icon-button" id="voiceToggle" title="Read replies aloud">◉</button></div></header>
    <section class="conversation"><div class="messages" id="messages"><div class="welcome" id="welcome"><h1>Intelligence, in focus.</h1><p>Ask, reason, explore the web, or speak naturally. Quadron pulls long-term memory only when it helps.</p><div class="suggestions"><button>Plan my week</button><button>What changed in AI this week?</button><button>Help me understand a concept</button></div></div></div><div class="activity" id="activity"><span class="orb"></span><span id="activityText">Quadron is thinking</span></div><div class="composer-wrap"><div class="composer"><button class="utility" id="mic" title="Speak to Quadron">⌁</button><textarea id="prompt" rows="1" placeholder="Message Quadron…" aria-label="Message Quadron"></textarea><button class="send" id="send">Send</button></div><div class="composer-note">Quadron can make mistakes. Check important details.</div></div></section>
  </main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), messages=$('#messages'), prompt=$('#prompt'), activity=$('#activity');
let chatId=null, chats=JSON.parse(localStorage.getItem('quadron-chats')||'[]'), current=[], recorder, chunks=[], audioUrl, voiceOn=false;
const userId=localStorage.getItem('quadron-user-id')||crypto.randomUUID();localStorage.setItem('quadron-user-id',userId);
function persist(){localStorage.setItem('quadron-chats',JSON.stringify(chats.slice(0,30)))}
function title(text){return text.replace(/\s+/g,' ').trim().slice(0,42)||'New conversation'}
function renderHistory(){const box=$('#history');box.innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.textContent=c.title;b.className=c.id===chatId?'active':'';b.onclick=()=>load(c.id);box.append(b)})}
function escapeText(text){return text}
function add(role,text){$('#welcome')?.remove();const item=document.createElement('article');item.className='message '+(role==='user'?'user':'assistant');item.innerHTML=`<div class="avatar">${role==='user'?'You':'Q'}</div><div><div class="meta">${role==='user'?'You':'Quadron'}</div><div class="bubble"></div></div>`;item.querySelector('.bubble').textContent=escapeText(text);messages.append(item);messages.scrollTop=messages.scrollHeight}
function redraw(){messages.innerHTML='';if(!current.length){messages.innerHTML=`<div class="welcome" id="welcome"><h1>Intelligence, in focus.</h1><p>Ask, reason, explore the web, or speak naturally. Quadron pulls long-term memory only when it helps.</p><div class="suggestions"><button>Plan my week</button><button>What changed in AI this week?</button><button>Help me understand a concept</button></div></div>`;bindSuggestions();return}current.forEach(m=>add(m.role,m.content))}
function save(){if(!chatId)return;const i=chats.findIndex(c=>c.id===chatId);const data={id:chatId,title:title(current[0]?.content),messages:current,updated:Date.now()};if(i<0)chats.unshift(data);else chats[i]=data;chats.sort((a,b)=>b.updated-a.updated);persist();renderHistory()}
function start(){chatId=crypto.randomUUID();current=[];redraw();renderHistory();prompt.focus()}
function load(id){const c=chats.find(x=>x.id===id);if(!c)return;chatId=id;current=c.messages||[];redraw();renderHistory();$('#sidebar').classList.remove('open')}
function showActivity(search){activity.classList.add('show');activity.classList.toggle('searching',search);$('#activityText').textContent=search?'Searching the web…':'Quadron is thinking…'}
function hideActivity(){activity.classList.remove('show','searching')}
function toast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function send(text=prompt.value.trim()){if(!text)return;if(!chatId)start();prompt.value='';resize();current.push({role:'user',content:text});add('user',text);save();showActivity(/(today|latest|news|current|search|web|this week|price)/i.test(text));$('#send').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:text,userId,history:current.slice(0,-1)})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');current.push({role:'assistant',content:d.reply});add('assistant',d.reply);save();if(voiceOn)speak(d.reply);if(d.usedSearch)toast('Web search used') }catch(e){add('assistant','I hit a connection problem: '+e.message);toast('Message failed')}finally{hideActivity();$('#send').disabled=false;prompt.focus()}}
function resize(){prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,150)+'px'}
async function speak(text){try{if(audioUrl)URL.revokeObjectURL(audioUrl);const r=await fetch('/api/speech/speak',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error();audioUrl=URL.createObjectURL(await r.blob());const a=new Audio(audioUrl);a.play()}catch{toast('Voice playback is unavailable')}}
async function toggleRecording(){const mic=$('#mic');if(recorder?.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());mic.classList.remove('active');showActivity(false);$('#activityText').textContent='Transcribing your voice…';const form=new FormData();form.append('audio',new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),'quadron.webm');try{const r=await fetch('/api/speech/transcribe',{method:'POST',body:form}),d=await r.json();if(!r.ok)throw Error(d.error);prompt.value=d.text||'';resize();if(prompt.value.trim())send()}catch(e){toast(e.message||'Could not transcribe audio')}finally{hideActivity()}};recorder.start();mic.classList.add('active');toast('Listening… tap again to send')}catch{toast('Microphone permission is needed')}}
function bindSuggestions(){document.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>send(b.textContent))}
$('#send').onclick=()=>send();prompt.oninput=resize;prompt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#newChat').onclick=start;$('#clear').onclick=start;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#mic').onclick=toggleRecording;$('#voiceToggle').onclick=()=>{voiceOn=!voiceOn;$('#voiceToggle').classList.toggle('active',voiceOn);toast(voiceOn?'Voice replies on':'Voice replies off')};bindSuggestions();renderHistory();
</script></body></html>
